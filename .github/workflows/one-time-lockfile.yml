name: One-time audited lockfile refresh
on:
  push:
    branches: [secure-partner-room-20261106]
    paths: [.github/workflows/one-time-lockfile.yml]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.repository == 'tooniog/runners-futurum-site' && github.ref == 'refs/heads/secure-partner-room-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Update lockfile without running package scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          git add package-lock.json
          git -c user.name='Runners Security Automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Lock patched Next.js and transitive dependency versions'
          git push origin HEAD:secure-partner-room-20261106

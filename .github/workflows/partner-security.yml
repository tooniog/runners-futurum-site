name: Partner Room security checks
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/partner-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Build and smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PARTNER_ACCESS_CODE="$(openssl rand -hex 32)"
          export PARTNER_SESSION_SECRET="$(openssl rand -hex 48)"
          npm ci
          npm run build
          node --test tests/partner-room-smoke.test.mjs
